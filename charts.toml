# Vendored Helm chart registry.
# To update: change the version below, run `just fetch <name>`, review `git diff`.
# Use `just outdated` to see which charts have newer upstream versions.

[alloy]
repo = "https://grafana.github.io/helm-charts"
chart = "alloy"
version = "1.7.0"

[argo-cd]
oci = "oci://ghcr.io/argoproj/argo-helm/argo-cd"
chart = "argo-cd"
version = "7.8.4"

